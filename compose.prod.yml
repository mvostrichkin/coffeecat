services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - CADDY_AUTH_USERNAME=${CADDY_AUTH_USERNAME}
      - CADDY_AUTH_PASSWORD=${CADDY_AUTH_PASSWORD}
    volumes:
      - ./caddy/Caddyfile: /etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - svelte-app

  svelte-app:
    build: ./svelte-app
    restart: always
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017/main?authSource=admin
    depends_on:
      - mongodb

volumes:
  caddy_data:
  caddy_config:

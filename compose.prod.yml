services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - path: ./svelte-app/.env
        required: true
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - svelte-app

  svelte-app:
    build: ./svelte-app
    restart: always
    depends_on:
      - db

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # - DOMAIN_NAME=${DOMAIN_NAME}
      - CADDY_AUTH_USERNAME=${CADDY_AUTH_USERNAME}
      - CADDY_AUTH_PASSWORD=${CADDY_AUTH_PASSWORD}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - svelte-app

  svelte-app:
    build: ./svelte-app
    restart: always
    environment:
      # - POSTGRES_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

volumes:
  caddy_data:
  caddy_config:

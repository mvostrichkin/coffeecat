services:
  webserver:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN
      - CADDY_AUTH_USERNAME
      - CADDY_AUTH_PASSWORD
    volumes:
      - .Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  
  sveltekit:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}
      - BETTER_AUTH_SECRET
      - BETTER_AUTH_URL
    depends_on:
      - database
      - webserver

volumes:
  caddy_data:
  caddy_config:
